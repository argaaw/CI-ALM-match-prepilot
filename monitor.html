<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pre-pilot monitor</title>
<style>
:root { --bg:#f7f7f3; --card:#fff; --ink:#1d1d1b; --muted:#6b6b66; --line:#dcdcd5; --accent:#2a5d8f; --ok:#2e7d4f; --warn:#b4452c; --flash:#fff3b0; }
* { box-sizing:border-box; } body { margin:0; padding:16px; background:var(--bg); color:var(--ink); font:15px/1.5 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif; }
h1 { font-size:1.2rem; margin:0 0 10px; } .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px; margin-bottom:12px; }
input { font:inherit; padding:8px 10px; border:1px solid var(--line); border-radius:8px; width:120px; letter-spacing:.2em; text-align:center; }
button { font:inherit; padding:8px 14px; border:1px solid var(--line); border-radius:8px; background:var(--card); cursor:pointer; } button.primary { background:var(--accent); color:#fff; border-color:var(--accent); }
.muted { color:var(--muted); font-size:.9rem; } .ok { color:var(--ok); font-weight:700; } .warn { color:var(--warn); font-weight:700; }
table { border-collapse:collapse; width:100%; font-variant-numeric:tabular-nums; } th, td { border:1px solid var(--line); padding:6px 8px; text-align:center; } th { background:#f0f0ea; font-weight:600; font-size:.85rem; }
td.name { text-align:left; white-space:nowrap; } td.r { font-weight:700; font-size:1.05rem; } td.r.flash { background:var(--flash); } td.empty { color:#c5c5bd; }
td.r[data-v="1"], td.r[data-v="2"] { color:var(--warn); } td.r[data-v="6"], td.r[data-v="7"] { color:var(--ok); }
tfoot td { font-weight:700; background:#f7f7f3; } .log { max-height:220px; overflow:auto; font-size:.85rem; } .log div { padding:2px 0; border-bottom:1px dashed var(--line); }
.row { display:flex; gap:10px; align-items:center; flex-wrap:wrap; } .pill { display:inline-block; padding:2px 8px; border-radius:999px; background:#eef2f6; font-size:.85rem; margin-right:6px; }
@media (max-width:640px) { th, td { padding:4px 4px; font-size:.85rem; } }
</style></head><body>
<h1>Pre-pilot 실시간 모니터 (연구자용)</h1>
<div class="card"><div class="row"><label>참가자 번호(뒷자리 4자리) <input id="pid" inputmode="numeric" maxlength="4" placeholder="5678"></label><button class="primary" id="go">보기</button><button id="stop" disabled>멈춤</button><span class="muted" id="st">4초마다 서버에서 새로 읽습니다.</span></div></div>
<div class="card" id="meta" hidden></div>
<div class="card" hidden id="grid"></div>
<div class="card" hidden><b>변경 기록</b><div class="log" id="log"></div></div>
<script>
const API_URL = "https://zwmdukuecvntquygsksv.supabase.co/functions/v1/human-evaluation", EVAL_ID = "ssdci-match-prepilot-001", KEY = [{"question": "q01", "sim": 1, "condition": "me201_song", "domain": "instrument", "label": "플루트"}, {"question": "q01", "sim": 2, "condition": "kopsch_fft_noise", "domain": "instrument", "label": "플루트"}, {"question": "q01", "sim": 3, "condition": "kopsch_fft_sine", "domain": "instrument", "label": "플루트"}, {"question": "q01", "sim": 4, "condition": "peters_a_noise", "domain": "instrument", "label": "플루트"}, {"question": "q01", "sim": 5, "condition": "peters_a_sine", "domain": "instrument", "label": "플루트"}, {"question": "q02", "sim": 1, "condition": "me201_song", "domain": "instrument", "label": "피아노"}, {"question": "q02", "sim": 2, "condition": "kopsch_fft_noise", "domain": "instrument", "label": "피아노"}, {"question": "q02", "sim": 3, "condition": "kopsch_fft_sine", "domain": "instrument", "label": "피아노"}, {"question": "q02", "sim": 4, "condition": "peters_a_noise", "domain": "instrument", "label": "피아노"}, {"question": "q02", "sim": 5, "condition": "peters_a_sine", "domain": "instrument", "label": "피아노"}, {"question": "q03", "sim": 1, "condition": "me201_song", "domain": "instrument", "label": "바이올린"}, {"question": "q03", "sim": 2, "condition": "kopsch_fft_noise", "domain": "instrument", "label": "바이올린"}, {"question": "q03", "sim": 3, "condition": "kopsch_fft_sine", "domain": "instrument", "label": "바이올린"}, {"question": "q03", "sim": 4, "condition": "peters_a_noise", "domain": "instrument", "label": "바이올린"}, {"question": "q03", "sim": 5, "condition": "peters_a_sine", "domain": "instrument", "label": "바이올린"}, {"question": "q04", "sim": 1, "condition": "me201_song", "domain": "lyrics", "label": "노래"}, {"question": "q04", "sim": 2, "condition": "kopsch_fft_noise", "domain": "lyrics", "label": "노래"}, {"question": "q04", "sim": 3, "condition": "kopsch_fft_sine", "domain": "lyrics", "label": "노래"}, {"question": "q04", "sim": 4, "condition": "peters_a_noise", "domain": "lyrics", "label": "노래"}, {"question": "q04", "sim": 5, "condition": "peters_a_sine", "domain": "lyrics", "label": "노래"}, {"question": "q05", "sim": 1, "condition": "me201_song", "domain": "instrument", "label": "트럼펫"}, {"question": "q05", "sim": 2, "condition": "kopsch_fft_noise", "domain": "instrument", "label": "트럼펫"}, {"question": "q05", "sim": 3, "condition": "kopsch_fft_sine", "domain": "instrument", "label": "트럼펫"}, {"question": "q05", "sim": 4, "condition": "peters_a_noise", "domain": "instrument", "label": "트럼펫"}, {"question": "q05", "sim": 5, "condition": "peters_a_sine", "domain": "instrument", "label": "트럼펫"}, {"question": "q06", "sim": 1, "condition": "me201_song", "domain": "instrument", "label": "일렉 기타(디스토션)"}, {"question": "q06", "sim": 2, "condition": "kopsch_fft_noise", "domain": "instrument", "label": "일렉 기타(디스토션)"}, {"question": "q06", "sim": 3, "condition": "kopsch_fft_sine", "domain": "instrument", "label": "일렉 기타(디스토션)"}, {"question": "q06", "sim": 4, "condition": "peters_a_noise", "domain": "instrument", "label": "일렉 기타(디스토션)"}, {"question": "q06", "sim": 5, "condition": "peters_a_sine", "domain": "instrument", "label": "일렉 기타(디스토션)"}, {"question": "q07", "sim": 1, "condition": "me201_song", "domain": "lyrics", "label": "노래"}, {"question": "q07", "sim": 2, "condition": "kopsch_fft_noise", "domain": "lyrics", "label": "노래"}, {"question": "q07", "sim": 3, "condition": "kopsch_fft_sine", "domain": "lyrics", "label": "노래"}, {"question": "q07", "sim": 4, "condition": "peters_a_noise", "domain": "lyrics", "label": "노래"}, {"question": "q07", "sim": 5, "condition": "peters_a_sine", "domain": "lyrics", "label": "노래"}];
const Q = [...new Set(KEY.map(k => k.question))].sort(), SIMS = [1,2,3,4,5]; const condOf = {}; KEY.forEach(k => condOf[k.question + '_' + k.sim] = k);
const COND = {}; KEY.filter(k => k.question === Q[0]).forEach(k => COND[k.sim] = k.condition);
let timer = null, prev = {}, prevMeta = '', pid = '', first = true;
const $ = id => document.getElementById(id); const t = () => new Date().toLocaleTimeString('ko-KR');
const qn = q => '소리 ' + parseInt(q.slice(1));
function logLine(s) { const d = document.createElement('div'); d.innerHTML = `<span class="muted">${t()}</span> ${s}`; $('log').prepend(d); $('log').parentElement.hidden = false; }
async function poll() {
  try {
    const r = await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ evaluation_id: EVAL_ID, participant_id: 'ssdci-' + pid, action: 'resume' }) });
    const j = await r.json(); if (!r.ok) throw new Error(j.error || r.status);
    const cur = {}; let meta = null, note = '';
    (j.answers || []).forEach(a => { if (a.sample_id === 'meta') { meta = Object.fromEntries(a.selected_options.map(o => o.split('='))); note = a.comment || ''; } else cur[a.sample_id] = { v: parseInt(a.selected_options[0]), at: a.updated_at }; });
    const n = Object.keys(cur).length, total = KEY.length;
    $('st').innerHTML = `${t()} 읽음 · <b>${n} / ${total}</b> 평가 · ${j.submitted_at ? '<span class="ok">제출됨 ' + new Date(j.submitted_at).toLocaleString('ko-KR') + '</span>' : '<span class="muted">미제출</span>'}`;
    const metaStr = meta ? `<span class="pill">방식 ${meta.mode || '-'}</span><span class="pill">인공와우 ${meta.ci || '-'}</span><span class="pill">반대쪽 귀 음량 ${meta.nh_volume ? Math.round(meta.nh_volume * 100) + '%' : '-'}</span><span class="pill">시작 ${meta.started ? new Date(meta.started).toLocaleTimeString('ko-KR') : '-'}</span>${note ? '<div style="margin-top:6px">의견: ' + note.replace(/</g, '&lt;') + '</div>' : ''}` : '<span class="muted">아직 설정 정보 없음(첫 화면만 지남)</span>';
    $('meta').innerHTML = metaStr; $('meta').hidden = false; if (meta && prevMeta && metaStr !== prevMeta) logLine('설정 변경: ' + Object.entries(meta).map(([k, v]) => k + '=' + v).join(', ')); prevMeta = metaStr;
    const changed = new Set();
    Object.keys(cur).forEach(k => { if (!prev[k] || prev[k].v !== cur[k].v) { changed.add(k); if (!first) { const c = condOf[k]; logLine(`<b>${qn(c.question)} · ${c.label}</b> / 시뮬 ${c.sim} (${c.condition}) → <b>${cur[k].v}</b>점${prev[k] ? ' (이전 ' + prev[k].v + ')' : ''}`); } } });
    if (first) logLine(`불러옴: ${n} / ${total} 평가`);
    const mean = qs => { const o = {}; SIMS.forEach(s => { const v = qs.map(q => cur[q + '_' + s]).filter(Boolean).map(x => x.v); o[s] = v.length ? (v.reduce((a, b) => a + b, 0) / v.length).toFixed(1) : '–'; o[s + 'n'] = v.length; }); return o; };
    const ma = mean(Q), mi = mean(Q.filter(q => condOf[q + '_1'].domain === 'instrument')), ml = mean(Q.filter(q => condOf[q + '_1'].domain === 'lyrics'));
    $('grid').innerHTML = `<table><thead><tr><th>소리</th>${SIMS.map(s => `<th>시뮬 ${s}<br><span class="muted">${COND[s]}</span></th>`).join('')}<th>진행</th></tr></thead><tbody>${Q.map(q => { const c = condOf[q + '_1']; const done = SIMS.filter(s => cur[q + '_' + s]).length; return `<tr><td class="name">${qn(q)} · ${c.label}</td>${SIMS.map(s => { const x = cur[q + '_' + s]; return x ? `<td class="r ${changed.has(q + '_' + s) ? 'flash' : ''}" data-v="${x.v}" title="${new Date(x.at).toLocaleTimeString('ko-KR')}">${x.v}</td>` : '<td class="empty">·</td>'; }).join('')}<td class="${done === 5 ? 'ok' : ''}">${done}/5</td></tr>`; }).join('')}</tbody><tfoot><tr><td class="name">평균 (n)</td>${SIMS.map(s => `<td>${ma[s]} (${ma[s + 'n']})</td>`).join('')}<td></td></tr><tr><td class="name muted">악기 / 노래</td>${SIMS.map(s => `<td class="muted">${mi[s]} / ${ml[s]}</td>`).join('')}<td></td></tr></tfoot></table><p class="muted" style="margin:8px 0 0">1–2점은 붉게, 6–7점은 초록으로, 방금 바뀐 칸은 노랗게 표시됩니다. 칸에 마우스를 올리면 저장 시각이 보입니다.</p>`;
    $('grid').hidden = false; prev = cur; first = false;
  } catch (e) { $('st').innerHTML = `<span class="warn">읽기 실패: ${e.message}</span>`; }
}
$('go').onclick = () => { pid = $('pid').value.trim(); if (!/^\d{4}$/.test(pid)) { alert('숫자 4자리를 입력하세요'); return; } clearInterval(timer); prev = {}; prevMeta = ''; first = true; $('log').innerHTML = ''; logLine('참가자 ssdci-' + pid + ' 모니터 시작'); poll(); timer = setInterval(poll, 4000); $('stop').disabled = false; location.hash = pid; };
$('stop').onclick = () => { clearInterval(timer); timer = null; $('stop').disabled = true; $('st').textContent = '멈춤'; };
if (/^#\d{4}$/.test(location.hash)) { $('pid').value = location.hash.slice(1); $('go').click(); }
</script></body></html>
