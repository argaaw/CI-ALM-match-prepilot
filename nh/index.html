  const b = el(`<button class="primary">제출하기</button>`);
  b.onclick = async () => { b.disabled = true; ta.readOnly = true; b.textContent = "제출 중…";
    try { await saveMeta(); for (const id of Object.keys(S.rec)) await saveItem(id); const j = await api({ action: "submit" }); S.submittedAt = j ? j.submitted_at : now(); save(); render(); }
    catch (e) { b.disabled = false; ta.readOnly = false; b.textContent = "다시 제출하기"; st.textContent = "제출되지 않았습니다. 인터넷 연결을 확인하신 뒤 다시 눌러 주세요."; } };
  sb.appendChild(b); sb.appendChild(st);
  return c;
}
render(); if (S.pid) resume();
</script></body></html>
